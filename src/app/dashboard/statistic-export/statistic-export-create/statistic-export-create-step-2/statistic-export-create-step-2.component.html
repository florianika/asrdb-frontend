<div class="d-flex flex-column h-100 overflow-hidden">
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z0 h-100 overflow-hidden d-block">

    <!-- Municipality Column -->
    <ng-container matColumnDef="municipality">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Municipality
      </th>
      <td mat-cell *matCellDef="let row">
        {{ row.municipality }}
      </td>
    </ng-container>

    <!-- Dynamic Quality Columns -->
    <ng-container *ngFor="let quality of qualities" [matColumnDef]="quality">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Quality {{ quality }}
      </th>
      <td mat-cell *matCellDef="let row">
        {{ row[quality] }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      @if (!isLoadingDwellingQualityStatistics) {
        <td class="mat-cell no-data-cell" [colSpan]="displayedColumns.length">No data</td>
      } @else {
        <td class="mat-cell no-data-cell" [colSpan]="displayedColumns.length">
          <mat-progress-spinner
            diameter="30"
            mode="indeterminate"
          ></mat-progress-spinner>
        </td>
      }
    </tr>
  </table>
  <div class="text-end">
    <button mat-button (click)="moveToPrevious()" [disabled]="isLoadingDwellingQualityStatistics">
      <span>Back</span>
      <mat-icon>arrow_back_ios</mat-icon>
    </button>
    <button mat-raised-button class="ms-2" color="primary" (click)="moveToNext()" [disabled]="isLoadingDwellingQualityStatistics">
      <span>Next</span>
      <mat-icon iconPositionEnd>arrow_forward_ios</mat-icon>
    </button>
  </div>
</div>
