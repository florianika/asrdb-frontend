<div class="full-height-stepper">
  <form [formGroup]="formGroup">
    <div class="row mt-2">
      <div class="col-md-4 col-12">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label i18n>Name</mat-label>
          <input
            matInput
            i18n-placeholder
            placeholder="Last name, First name"
            formControlName="fieldWorkName"
            required />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 col-12">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label i18n>Description</mat-label>
          <textarea
            matInput
            i18n-placeholder
            placeholder="Add description for the field work"
            formControlName="description"
            required
            rows="5"></textarea>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-12 col-md-4">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label i18n>Start Date</mat-label>
          <input
            matInput
            [matDatepicker]="startDatePicker"
            formControlName="startDate"
            required
            readonly />
          <mat-datepicker-toggle
            matSuffix
            [for]="startDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #startDatePicker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-12 col-md-4">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label i18n>End Date</mat-label>
          <input
            matInput
            [matDatepicker]="endDatePicker"
            formControlName="endDate"
            required />
          <mat-datepicker-toggle
            matSuffix
            [for]="endDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #endDatePicker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>
  </form>
  <div class="d-flex mb-1">
    <button
      mat-raised-button
      color="warn"
      (click)="handleClose()"
      [disabled]="fieldWorkState().isSaving || fieldWorkState().isLoading">
      <span i18n>Save draft & Close</span>
    </button>
    <span class="flex-grow-1"></span>
    <button
      mat-raised-button
      color="primary"
      (click)="handleGeneralPage()"
      [disabled]="fieldWorkState().isSaving || fieldWorkState().isLoading">
      <span i18n>Next</span>
      <mat-icon iconPositionEnd>arrow_forward_ios</mat-icon>
    </button>
  </div>
</div>
