<div class="asrbd-container mat-elevation-z2" style="background-color: white;">
    <div class="header-container">
        <h1 i18n class="header-title">Email Template Management</h1>
        <span class="spacer"></span>
        <button mat-icon-button matTooltip="Add new role" (click)="createEmailTemplate()" class="add-role-button" >
            <mat-icon>add</mat-icon>
        </button>
    </div>

    <div class="asrbd-loading-shade" *ngIf="isLoadingResults | async">
        <mat-spinner></mat-spinner>
    </div>

    <div class="asrbd-table-container">
        <table class="asrbd-table" mat-table matSort [dataSource]="(dataSourceObservable | async) ?? []">
            <ng-container>
                <ng-container matColumnDef="emailTemplateId">
                    <th mat-header-cell *matHeaderCellDef>#</th>
                    <td mat-cell *matCellDef="let row">{{row.emailTemplateId}}</td>
                </ng-container>

                <ng-container matColumnDef="subject">
                    <th mat-header-cell mat-sort-header *matHeaderCellDef i18n>Subject</th>
                    <td mat-cell *matCellDef="let row">{{row.subject}}</td>
                </ng-container>

                <ng-container matColumnDef="createdUser">
                    <th mat-header-cell mat-sort-header *matHeaderCellDef i18n>Created User</th>
                    <td mat-cell *matCellDef="let row">{{row.createdUser}}</td>
                </ng-container>

                <ng-container matColumnDef="createdTimestamp">
                    <th mat-header-cell mat-sort-header *matHeaderCellDef i18n>Created time</th>
                    <td mat-cell *matCellDef="let row">{{(row.createdTimestamp + "z") | date:'dd/MM/yyyy, hh:mm':'Europe/Tirane'}}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef i18n>Actions</th>
                    <td mat-cell *matCellDef="let row">
                        <button mat-icon-button [matMenuTriggerFor]="menu" [disabled]="isLoadingResults | async">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                        <mat-menu #menu="matMenu">
                            <button mat-menu-item (click)="editEmailTemplate(row)" i18n>Edit</button>
                        </mat-menu>
                    </td>
                </ng-container>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell no-data-cell" colspan="5" i18n>No data</td>
            </tr>
        </table>
    </div>
    <mat-paginator [length]="resultsLength" [pageSize]="30" [pageSizeOptions]="[10, 30, 100]"></mat-paginator>
</div>
