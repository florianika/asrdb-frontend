<div class="detail-container">
  <span class="detail-value-container" style="border: none">{{ title }}: </span>
  <span>
    <span class="detail-value-container">
      {{ value | buildingDetailFormat }}
    </span>
    <span class="detail-error-icon">
      @if (log) {
        <mat-icon [matTooltip]="log" [style.color]="color">info</mat-icon>
      }
    </span>
  </span>
</div>
