@if (!isLoadingResults) {
  <mat-dialog-content
    class="building-details-container mat-typography"
    style="color: initial; margin: 10px">
    <mat-card class="building-details-card">
      <mat-card-content>
        <h2 class="details-header">
          <span i18n>Dwelling details</span>
          <button
            mat-icon-button
            aria-label="Edit dwelling"
            i18n-aria-label
            class="float-end"
            (click)="editDwellingDetails()">
            <mat-icon>edit</mat-icon>
          </button>
        </h2>
        <span class="details-subheader">
          <span i18n>Data Quality:</span>
          <span style="font-weight: bold">{{
            getValueFromStatus('DwlQuality')
          }}</span>
        </span>
        @for (section of sections; track section.title) {
          <section [id]="section.title.toLowerCase().replace(' ', '-')">
            <h3>{{ section.title }}</h3>
            @for (entry of section.entries; track entry.title) {
              <asrdb-building-detail
                [title]="entry.title"
                [value]="entry.value"
                [log]="entry.log"
                [logType]="entry.logType"></asrdb-building-detail>
            }
            <hr />
          </section>
        }
      </mat-card-content>
    </mat-card>
    <div class="building-last-modified-card">
      @if (dwelling) {
        <asrdb-history-details
          [externalCreator]="dwelling.external_creator"
          [externalCreationDate]="dwelling.external_creator_date"
          [externalUpdater]="dwelling.external_editor"
          [externalUpdateDate]="
            dwelling.external_editor_date
          "></asrdb-history-details>
      }
    </div>
  </mat-dialog-content>
} @else {
  <div class="loading-container">
    <mat-spinner></mat-spinner>
  </div>
}
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
