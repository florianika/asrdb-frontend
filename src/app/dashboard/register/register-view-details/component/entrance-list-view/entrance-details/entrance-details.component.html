<mat-dialog-content *ngIf="!isLoadingResults" class="mat-typography" style="color: initial; margin: 10px;">
  <div class="row">
    <mat-card class="col-12 col-md-5">
      <mat-card-content>
        <h2 class="details-header" i18n>
          Entrance details
          <button class="float-end" mat-icon-button (click)="openEditView()" mat-dialog-close>
            <mat-icon>edit</mat-icon>
          </button>
        </h2>
        @for (titlePart of titleSection; track titlePart.propName) {
          <span class="details-subheader mb-1 d-block">
            <span i18n class="me-1">Data quality:</span>
            <span style="font-weight: bold;">{{getValueFromStatus(titlePart.propName)}}</span>
          </span>
        }
        <br/>
        <section *ngFor="let section of sections">
          <h3>{{section.title}}</h3>
          <asrdb-building-detail
            *ngFor="let entry of section.entries"
            [title]="entry.title"
            [value]="entry.value"
            [log]="entry.log"
            [logType]="entry.logType"
          ></asrdb-building-detail>
          <hr>
        </section>
      </mat-card-content>
    </mat-card>
    <div class="col-12 col-md-7">
      <asrdb-history-details
        [externalCreator]="entrance.external_creator"
        [externalCreationDate]="entrance.external_creator_date"
        [externalUpdater]="entrance.external_editor"
        [externalUpdateDate]="entrance.external_editor_date"
      ></asrdb-history-details>
      <asrdb-register-map
        *ngIf="buildingGlobalId"
        [enableFilter]="false"
        [enableSelection]="false"
        [buildingGlobalId]="buildingGlobalId"
        [skipOtherFiltersApartFromGlobalId]="true"
        [small]="true"
      ></asrdb-register-map>
      <asrdb-dwelling-list-view
        [entranceId]="id!"
        [entrances]="[entrance]"
        [buildingNumber]="building.BldProperty"
        (dwellingUpdated)="dwellingUpdated($event)"
      ></asrdb-dwelling-list-view>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
