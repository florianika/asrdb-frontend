<h2 mat-dialog-title i18n>{{data.title}}</h2>
<mat-dialog-content style="white-space: pre-wrap">
  {{data.message}}
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close i18n>{{data.cancelButtonText}}</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="true" i18n>{{data.confirmButtonText}}</button>
</mat-dialog-actions>
