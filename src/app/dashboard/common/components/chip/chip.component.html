<div class="chips-container">
  @for (chip of filteredChips; track chip) {
    <div>
      @if (chip.column !== 'GlobalID') {
        <span class="chip">
          <span>{{ chip.column }}</span
          >: <span>{{ chip.value | concatenateMessage: 20 }}</span>
          @if (clearable) {
            <mat-icon class="chip-close-icon" (click)="removeChip(chip)"
              >cancel</mat-icon
            >
          }
        </span>
      }
    </div>
  }
</div>
