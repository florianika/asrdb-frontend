<div class="map-wrapper">
  <div [class]="small ? 'small-map' : ''" #mapViewNode></div>

  @if (
    !isMapReady &&
    (isMapInitializing || (isRefreshing$ | async)) &&
    !mapAuthError
  ) {
    <div class="map-status-overlay">
      <div i18n>Refreshing authentication and loading map...</div>
    </div>
  }

  @if (mapAuthError) {
    <div class="map-error-banner">
      <span>{{ mapAuthError }}</span>
      <button type="button" class="retry-button" (click)="retryMapAuth()" i18n>
        Retry
      </button>
    </div>
  }
</div>
