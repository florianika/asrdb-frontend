@if (isLoggedIn | async) {
  <mat-toolbar class="mat-elevation-z6" style="margin-bottom: 1px">
    <button mat-icon-button (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <img
      src="assets/images/logo_instat.png"
      style="width: 150px"
      alt="instat logo" />
    <span class="toolbar-spacer"></span>
    <ng-container>
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">Sign out</button>
      </mat-menu>
    </ng-container>
    <ng-container>
      <button
        mat-icon-button
        style="width: 20px; height: 20px"
        (click)="changeLanguage('sq')">
        <img
          alt="al image"
          ngSrc="assets/images/al.png"
          fill
          style="object-fit: cover" />
      </button>
      <button
        mat-icon-button
        class="ms-2"
        style="width: 20px; height: 20px"
        (click)="changeLanguage('en')">
        <img
          alt="en image"
          ngSrc="assets/images/en.png"
          fill
          style="object-fit: cover" />
      </button>
    </ng-container>
  </mat-toolbar>
}
