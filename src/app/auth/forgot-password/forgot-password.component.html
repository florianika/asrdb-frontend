<section class="login-container">
  <mat-card class="login-card">
    <img class="login-card-logo" src="assets/images/logo_instat.png" alt="logo">
    <mat-card-title class="login-card-title" i18n>
      Enter email to reset your password
    </mat-card-title>
    <mat-card-content class="login-card-content">
      <form [formGroup]="forgotPassword">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label i18n>Email</mat-label>
          <input matInput i18n-placeholder placeholder="Enter your email" formControlName="email" (keyup.enter)="resetPassword()">
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>
      </form>

      <button mat-flat-button color="primary" class="full-width" style="height: 52px;" (click)="resetPassword()" [disabled]="loading | async" i18n>Continue</button>
<!--      <p class="login-card-create-account" routerLink="/auth/signup" i18n>Create an account</p>-->
    </mat-card-content>
  </mat-card>
</section>
